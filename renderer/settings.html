<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'"><title>桌宠设置</title><link rel="stylesheet" href="settings.css"></head><body><main><header><div class="mark">🐋</div><div><h1>桌宠设置</h1><p>把鲸鱼调成你喜欢的样子</p></div></header><section><h2>外观</h2><label>桌宠风格<select id="style"><option value="classic">🌊 经典蓝鲸</option><option value="candy">🍬 软糖 Pastel</option><option value="night">🌙 夜航深色</option><option value="pixel">🟩 像素复古</option></select></label><label class="check"><input id="reducedMotion" type="checkbox"> 减少动效</label></section><section><h2>声音</h2><label class="check"><input id="sound" type="checkbox"> 开启桌宠音效</label></section><section><h2>连接</h2><label>DSH 地址<input id="url" placeholder="http://127.0.0.1:3080"></label><p class="hint">修改后重启桌宠或点击刷新状态生效。</p></section><section><h2>启动</h2><label class="check"><input id="launchAtLogin" type="checkbox"> 登录后自动启动</label></section><footer><span id="status"></span><button id="save">保存设置</button></footer></main><script src="settings.js"></script></body></html>
