name: Build desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test Windows command shims
        if: matrix.platform == 'win'
        run: node scripts/test-cli-process.js
      - run: npm run build:${{ matrix.platform }}
      - name: Verify macOS disk images and app signatures
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          for dmg in release/*.dmg; do
            hdiutil verify "$dmg"
            mount_dir="$(mktemp -d)"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
            app_path="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$app_path"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            hdiutil detach "$mount_dir"
          done
      - name: Verify Windows installer
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $installer -or $installer.Length -lt 1MB) { throw 'Windows installer is missing or empty' }
          $header = [System.IO.File]::ReadAllBytes($installer.FullName)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) { throw 'Windows installer is not a PE executable' }
      - name: Verify Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          file release/*.AppImage | grep -q 'ELF 64-bit'
          dpkg-deb --info release/*.deb >/dev/null
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'mac'
        with:
          name: ds-pet-${{ matrix.platform }}
          path: release/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'win'
        with:
          name: ds-pet-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: ds-pet-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
